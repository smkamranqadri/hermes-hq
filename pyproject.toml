[project]
name = "hermes-hq"
version = "0.1.0"
description = "Portable control plane for a Hermes Agent team: projects, tasks, real agent sessions, status and unblock."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pywebpush>=2.0"]

[project.scripts]
hermes-hq = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "core"]
